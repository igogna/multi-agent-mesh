[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentdev"
version = "0.1.0"
description = "Automates the requirement -> code -> tests -> PR -> review -> human-merge-gate lifecycle."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "anthropic",
    "PyGithub",
    "GitPython",
    "docker",
    "python-dotenv",
    "langgraph",
    "tomli>=2; python_version < '3.11'",
    # Graphify's own PyPI name -- declared here (not just lazily pip-installed
    # by tools/graphify_manager.py at `agentdev bootstrap` time) so it's
    # already present in `uv tool install`-managed environments, which ship
    # without pip and can't self-install it later.
    "graphifyy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "langgraph-cli[inmem]"]

[project.scripts]
agentdev = "adapters.cli_adapter.main:main"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["adapters", "core", "tools"]

[tool.hatch.build.targets.wheel.force-include]
"sandbox" = "adapters/cli_adapter/_data/sandbox"
"adapters/cli_adapter/_build_info.py" = "adapters/cli_adapter/_build_info.py"

[tool.hatch.build.targets.sdist]
include = [
    "adapters/",
    "core/",
    "tools/",
    "sandbox/",
    "pyproject.toml",
    "hatch_build.py",
    "README.md",
]
